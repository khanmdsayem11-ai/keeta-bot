name: Run Keeta Bot

on:
  schedule:
    - cron: '*/5 * * * *' # প্রতি ৫ মিনিট পর পর অটোমেটিক রান হবে
  workflow_dispatch: # হাত দিয়ে ম্যানুয়ালি রান করার অপশন[cite: 8]

jobs:
  run-bot:
    runs-on: ubuntu-latest[cite: 8]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4[cite: 8]

      - name: Set up Python
        uses: actions/setup-python@v5[cite: 8]
        with:
          python-version: '3.10'[cite: 8]

      - name: Install dependencies
        run: |
          pip install requests[cite: 8]

      - name: Run Python Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python bot.py[cite: 8]
